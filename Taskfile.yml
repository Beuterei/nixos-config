# Host tasks. The argument after -- is the host.
version: "3"

tasks:
  check:
    desc: Evaluate the flake without activating it
    cmds:
      - nix flake check --no-build
      - nix eval --raw .#nixosConfigurations.{{.CLI_ARGS}}.config.system.build.toplevel.drvPath

  test:
    desc: Activate the configuration without making it the boot default
    cmds:
      - sudo nixos-rebuild test --flake .#{{.CLI_ARGS}}

  switch:
    desc: Activate the configuration and make it the boot default
    cmds:
      - sudo nixos-rebuild switch --flake .#{{.CLI_ARGS}}
